<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루금융 | 학교 금융 시뮬레이터</title><style>
:root{--bg:#f3f6fc;--paper:#fff;--text:#16243b;--muted:#718096;--blue:#315ee8;--pale:#eaf0ff;--border:#e4e9f2;--red:#df4466;--green:#139776;--shadow:0 9px 32px #1c3a7310}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}main{max-width:1250px;margin:28px auto;padding:0 20px 48px}.logo{font-weight:900;color:var(--blue);font-size:23px;letter-spacing:-1px}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.badge{border-radius:99px;padding:6px 10px;background:var(--pale);color:var(--blue);font-weight:700;font-size:12px}.up{color:var(--red)}.down{color:var(--blue)}.green{color:var(--green)}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.nav button{border:0;border-radius:12px;background:#e9edf5;padding:11px 16px;color:#53617a;font-weight:750}.nav button.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);padding:23px;border:1px solid #eff2f8}.card h2,.card h3{margin:0 0 15px;font-size:18px;letter-spacing:-.3px}h1{font-size:27px;margin:0 0 15px}.big{font-size:35px;letter-spacing:-1.4px;font-weight:900}.metric{font-size:25px;font-weight:850;margin-top:7px}.positive{color:var(--red)}.negative{color:var(--blue)}.line{border-bottom:1px solid var(--border);margin:16px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}.wrap{flex-wrap:wrap}.btn{border:0;background:var(--blue);color:white;font-weight:800;border-radius:12px;padding:13px 17px}.btn.secondary{color:var(--blue);background:var(--pale)}.btn.ghost{color:#42516a;background:#eff2f8}.btn.red{background:#fff0f2;color:#ce3857}.btn.sm{padding:8px 11px;font-size:12px}.rowitem{padding:13px 0;border-bottom:1px solid var(--border)}.rowitem:last-child{border-bottom:0}.assetrow{display:flex;align-items:center;gap:12px;padding:13px;cursor:pointer;border-radius:13px}.assetrow:hover{background:#f2f6ff}.symbol{height:44px;width:44px;display:grid;place-items:center;background:var(--pale);color:var(--blue);border-radius:12px;font-weight:900;letter-spacing:-1px;font-size:12px;flex-shrink:0}.right{text-align:right;margin-left:auto}.input{width:100%;border:1px solid #d9e1ee;border-radius:11px;padding:12px 13px;background:white;outline:none}.input:focus{border-color:var(--blue)}label{font-size:13px;font-weight:700;display:block;margin:13px 0 7px}.hint{font-size:12px;color:var(--muted);margin-top:6px}.panel{max-width:480px;margin:50px auto}.seg{display:flex;gap:6px;padding:4px;background:#edf1f8;border-radius:12px}.seg button{flex:1;background:transparent;border:0;border-radius:9px;padding:9px 12px;font-weight:750;color:#718096}.seg button.active{background:white;color:var(--blue);box-shadow:0 1px 7px #0001}.chart{width:100%;height:235px;display:block;overflow:visible}.chartline{fill:none;stroke:var(--blue);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.chartpoint{fill:white;stroke:var(--blue);stroke-width:2;cursor:pointer}.chartpoint:hover{r:6}.sub{font-size:13px;color:var(--muted)}.news{background:#f6f8fd;border-radius:12px;padding:15px;margin:9px 0}.empty{padding:35px;text-align:center;color:#8a96a8}.tag{font-size:12px;background:#f1f4fa;color:#617088;padding:5px 8px;border-radius:7px;white-space:nowrap}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#17243b;color:#fff;padding:14px 18px;border-radius:11px;z-index:10;max-width:90%;box-shadow:0 8px 30px #0003}.alert{background:#fff6e5;padding:13px 15px;border-radius:12px;color:#845f17;font-size:13px;margin:10px 0}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:var(--muted);font-weight:700;background:#f7f9fe}td,th{padding:12px;border-bottom:1px solid var(--border);white-space:nowrap}.center{text-align:center}.qp{font-weight:900;font-size:14px;color:#67768b}.divider{height:15px}.half{display:grid;grid-template-columns:1fr 1fr;gap:12px}.jump{margin-top:10px}.step{display:inline-block;background:#edf4fc;padding:7px 10px;margin:4px;border-radius:8px;color:#465c7c;font-size:12px}.percentbar{width:100%;height:11px;background:#e7edf8;border-radius:10px;overflow:hidden}.percentbar span{display:block;background:var(--blue);height:100%}@media(max-width:760px){header{height:62px;padding:0 14px}main{padding:0 12px;margin:15px auto}.grid,.cols3,.half{grid-template-columns:1fr}.card{padding:18px;border-radius:16px}.big{font-size:29px}.nav{position:sticky;top:62px;background:var(--bg);padding:9px 0;z-index:4;flex-wrap:nowrap;overflow-x:auto}.nav button{flex-shrink:0;padding:10px 12px;font-size:12px}.logo{font-size:20px}.hide-mobile{display:none}}

.company-about{background:#f1f5ff;border:1px solid #dbe5fb;border-radius:14px;padding:15px;margin:15px 0;line-height:1.65}
.storybar{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}.storychapter{background:#eaf0ff;color:#2452b5;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:800}
.candle-key{display:flex;gap:13px;align-items:center;font-size:12px;color:#718096;margin-top:7px}.candle-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.preview-banner{padding:12px 16px;border-radius:12px;background:#fff4dc;border:1px solid #f5d38c;color:#775108;margin-bottom:14px;font-weight:700}
.ready-strip{background:#ecfdf5;border:1px solid #a7e9c5;border-radius:14px;padding:14px 16px;margin:0 0 17px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.ready-strip.pending{background:#f0f5ff;border-color:#cbd8ff}.ready-strip strong{font-size:15px}.ready-strip p{margin:5px 0 0;color:#52637c;font-size:13px}.ready-list{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.ready-label{display:inline-block;border-radius:10px;padding:5px 8px;font-size:12px;background:#e8eefb}.ready-label.done{background:#d1fae5;color:#065f46}.hold-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.today-pill{font-size:12px;border-radius:20px;padding:5px 10px;background:#e0eaff}.story-count{padding:7px 12px;border-radius:10px;background:#edf2ff;font-size:13px}.subtle-alert{border-radius:13px;background:#f0f7ff;padding:12px;color:#334d72;margin-top:10px}</style></head><body><div id="app"></div><div id="toast" style="display:none" class="toast"></div><script>
const $=s=>document.querySelector(s), money=n=>Math.round(n||0).toLocaleString('ko-KR')+'원', signed=n=>(n>0?'+':'')+(+n||0).toFixed(2)+'%', esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), daytext=n=>`${n}일차 · ${Math.ceil(n/6)}분기`,
 risk={stable:'안정형',growth:'성장형',high:'고위험',medium:'중위험',low:'저위험'};
let newsScope='today',newsSector='전체';
let token=localStorage.getItem('haru_token')||'',S=null,tab='home',selected='HBEL',history=[],range='all',pickedDay=null,authMode='join',marketFilter='all',previewTab='home',previewPid=null,previewData=null,joinCode=new URLSearchParams(location.search).get('join')||'';
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window._to);window._to=setTimeout(()=>el.style.display='none',4000)}
async function api(url,opt={}){const rsp=await fetch('/api'+url,{method:opt.method||'GET',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:opt.body?JSON.stringify(opt.body):undefined});let data;try{data=await rsp.json()}catch{throw Error('서버 연결 오류')}if(!rsp.ok)throw Error(data.detail||'처리에 실패했습니다.');return data}
async function refresh(){try{S=await api('/state');if(S.role==='admin'&&tab==='preview'&&previewPid){previewData=await api('/admin/student/'+previewPid)}render()}catch(e){if(e.message.includes('로그인')){token='';localStorage.removeItem('haru_token');S=null;render()}else toast(e.message)}}
function setToken(d){token=d.token;localStorage.setItem('haru_token',token);tab='home';refresh()}
async function submitAuth(){try{if(authMode==='create'){let d=await api('/rooms',{method:'POST',body:{name:$('#roomName').value,password:$('#pw').value,start_cash:parseInt($('#startCash').value)}});setToken(d);toast('게임방 코드: '+d.code)}else if(authMode==='admin'){setToken(await api('/admin/login',{method:'POST',body:{code:$('#code').value,password:$('#pw').value}}))}else{setToken(await api('/join',{method:'POST',body:{code:$('#code').value,name:$('#nickname').value,pin:$('#pin').value}}))}}catch(e){toast(e.message)}}
function authView(){let modes=[['join','학생 참가'],['admin','교사 로그인'],['create','게임방 만들기']];return `<header><div class="logo">◈ 하루금융</div><span class="muted small">우리 반의 가상 은행 & 증권</span></header><main><div class="panel card"><div style="font-size:34px;margin-bottom:8px">🏦</div><h1>내 손안의 금융시장</h1><p class="muted">가상의 24일 동안, 은행과 주식시장을 직접 체험해 보세요.</p><div class="seg">${modes.map(([k,v])=>`<button class="${authMode===k?'active':''}" onclick="authMode='${k}';render()">${v}</button>`).join('')}</div>${authMode==='create'?`<label>게임방 이름</label><input class="input" id="roomName" value="우리 반 금융시장"><label>교사용 비밀번호 (4자 이상)</label><input class="input" type="password" id="pw" placeholder="관리자 비밀번호"><label>학생 시작 자금</label><input class="input" id="startCash" type="number" value="100000" min="1000">`:`<label>게임방 코드</label><input class="input" id="code" value="${esc(joinCode)}" placeholder="예: A12B34" autocapitalize="characters">${authMode==='join'?`<label>학생 이름 / 별명</label><input class="input" id="nickname" placeholder="이름 입력"><label>개인 PIN (4자 이상)</label><input class="input" id="pin" type="password" placeholder="기억할 PIN 설정 또는 입력">`:`<label>교사용 비밀번호</label><input class="input" id="pw" type="password" placeholder="비밀번호">`}`}<button class="btn" style="width:100%;margin-top:22px" onclick="submitAuth()">${authMode==='create'?'게임방 생성':authMode==='admin'?'교사 로그인':'금융시장 입장'} →</button><p class="hint">학생은 같은 방 코드로 참가하고, 기존 이름과 PIN을 입력하면 다시 접속할 수 있어요.</p></div></main>`}
function dayFinishPanel(){
 if(S.role!=='player')return '';
 let ok=!!S.player.day_ready, trading=S.room.phase==='trading';
 return `<div class="ready-strip ${ok?'':'pending'}"><div><strong>${ok?'✅ 오늘의 투자 선택을 완료했어요':'📋 오늘의 투자 판단을 마쳤나요?'}</strong><p>${ok?'교사 화면에 완료로 표시됩니다. 다시 투자하려면 완료를 취소하세요.':'뉴스와 보유 자산을 확인한 뒤 선택 완료를 눌러 주세요. 시장 전체 마감은 교사가 진행합니다.'}</p></div>${trading?`<button class="btn ${ok?'secondary':''}" onclick="setDayReady(${ok?'false':'true'})">${ok?'선택 완료 취소':'✅ 하루 선택 완료'}</button>`:`<span class="tag">${S.room.phase==='closed'?'교사 장 마감 완료':'게임 종료'}</span>`}</div>`;
}
async function setDayReady(v){
 if(v&&!confirm('오늘의 투자 선택을 마쳤나요? 완료 후에는 다시 선택하기 전까지 거래할 수 없습니다.'))return;
 try{await api(v?'/day/complete':'/day/reopen',{method:'POST'});toast(v?'오늘 선택 완료! 교사에게 표시됩니다.':'선택 완료를 취소했습니다. 다시 거래할 수 있어요.');await refresh()}catch(e){toast(e.message)}
}
function head(){let a=S.role==='admin';let room=S.room;return `<header><div class="logo">◈ 하루금융</div><div class="flex"><span class="badge">${esc(room.name)} · ${esc(room.code)}</span><span class="hide-mobile muted small">${a?'🧑‍🏫 교사':esc(S.player.name)} · ${daytext(room.day)}</span><button class="btn ghost sm" onclick="logout()">로그아웃</button></div></header><main><div class="flex wrap" style="margin-bottom:18px"><div><div class="muted small">${daytext(room.day)} / 총 24일</div><h1>${a?'교사 운영센터':'안녕하세요, '+esc(S.player.name)+'님 👋'}</h1></div><span class="badge">${room.phase==='trading'?'● 거래 중':room.phase==='closed'?'■ 장 마감':'✓ 게임 종료'}</span></div><div class="nav">${(a?[['home','운영 현황'],['preview','학생 화면'],['players','학생 관리'],['news','시장 뉴스'],['orders','주문 내역'],['admin','진행·설정']]:[['home','홈'],['market','투자시장'],['bank','은행'],['portfolio','내 자산'],['news','뉴스'],['orders','주문·기록']]).map(([k,v])=>`<button onclick="go('${k}')" class="${tab===k?'active':''}">${v}</button>`).join('')}</div>${a?'':dayFinishPanel()}<div id="page"></div></main>`}
function logout(){token='';S=null;localStorage.removeItem('haru_token');render()}
function go(k){if(S?.role==='admin'&&tab==='preview'&&['home','market','detail','bank','portfolio','orders','news'].includes(k)){previewTab=k}else{tab=k}render();window.scrollTo({top:0,behavior:'smooth'})}
function asset(id){return S.assets.find(x=>x.id===id)}
function pricecell(a){return `<div class="right"><b>${money(a.price)}</b><div class="small ${a.change>=0?'up':'down'}">${a.change>=0?'▲':'▼'} ${signed(a.change)}</div></div>`}
function metric(label,val,subtitle){return `<div class="card"><div class="muted small">${label}</div><div class="metric">${val}</div><div class="sub" style="margin-top:7px">${subtitle||''}</div></div>`}
function newsCards(arr){return arr.map(x=>`<div class="news"><div class="flex wrap"><span class="tag">${esc(x.sector)} · ${x.day}일차</span><span class="storychapter">기업별 상황 · 다음 거래일 변동 요인</span></div><div style="font-weight:800;margin:10px 0 4px">${esc(x.title)}</div><div class="sub">${esc(x.body)}</div></div>`).join('')||'<div class="empty">해당 조건의 뉴스가 아직 없습니다.</div>'}
function latestNews(n=4){return newsCards(S.news.slice(0,n))}

function playerHome(){let p=S.player, top=[...S.assets].filter(a=>a.type==='stock').sort((a,b)=>Math.abs(b.change)-Math.abs(a.change)).slice(0,5);return `<div class="cols3">${metric('내 순자산',money(p.net),`시작 자금 대비 ${money(p.profit)} ${p.profit>=0?'증가':'감소'}`)}${metric('투자 가능 현금',money(p.cash),'거래 즉시 반영되는 잔액')}${metric('내 수익률',signed(p.profit/S.room.start_cash*100),`총 ${S.holdings.length}개 보유상품`)}</div><div class="divider"></div><div class="grid"><div class="card"><div class="flex"><h2>📈 시장 움직임</h2><button class="btn secondary sm" onclick="go('market')">모든 상품 보기</button></div>${top.map(a=>`<div class="assetrow" onclick="detail('${a.id}')"><div class="symbol">${a.id.slice(0,4)}</div><div><b>${esc(a.name)}</b><div class="sub">${esc(a.sector)} · ${risk[a.risk]}</div><div class="sub" style="max-width:275px;margin-top:3px">${esc(a.description||'').slice(0,65)}</div></div>${pricecell(a)}</div>`).join('')}</div><div class="card"><h2>📰 이어지는 금융 뉴스</h2>${latestNews(4)}<button class="btn secondary" onclick="go('news')">뉴스 더 보기</button></div></div><div class="divider"></div><div class="card"><h2>💡 금융 생활 가이드</h2><span class="step">1. 뉴스 읽기</span><span class="step">2. 가격 차트 확인</span><span class="step">3. 투자 또는 예금 가입</span><span class="step">4. 하루 마감</span><span class="step">5. 투자 성과 확인</span><p class="sub">매수·매도는 버튼을 누르는 즉시 체결되어 현금과 보유 수량에 반영됩니다. 손실도 발생할 수 있어요.</p></div>`}
function assetRow(a){return `<div class="assetrow" onclick="detail('${a.id}')"><div class="symbol">${a.type==='bond'?'채권':a.type==='gold'?'금':a.type==='etf'?'ETF':a.id.slice(0,4)}</div><div><b>${esc(a.name)}</b><div class="sub">${esc(a.sector)} · ${risk[a.risk]}</div><div class="sub" style="max-width:275px;margin-top:3px">${esc(a.description||'').slice(0,65)}</div></div>${pricecell(a)}<span class="muted">›</span></div>`}
function market(){let types=[['all','전체'],['stock','주식 20'],['etf','ETF'],['bond','채권'],['gold','금']];let list=S.assets.filter(a=>marketFilter==='all'||a.type===marketFilter);return `<div class="card"><div class="flex wrap"><div><h2>투자시장</h2><p class="sub">원하는 상품을 눌러 1일 단위 차트와 기업 정보를 확인하세요.</p></div><span class="badge">현재 ${S.room.day}일차 가격</span></div><div class="nav" style="position:static">${types.map(([k,v])=>`<button class="${marketFilter===k?'active':''}" onclick="marketFilter='${k}';render()">${v}</button>`).join('')}</div><div class="half">${list.map(assetRow).join('')}</div></div>`}
async function detail(id,side='buy'){selected=id;currentSide=side;pickedDay=null;range='all';if(S?.role==='admin'&&tab==='preview')previewTab='detail';else tab='detail';try{history=await api('/history/'+id)}catch(e){toast(e.message)}render()}
function svgchart(data,kind='price'){if(kind==='price')return candlechart(data);if(!data.length)return '<div class="empty">기록이 없습니다</div>';let W=680,H=225,l=36,r=14,t=24,b=30,vals=data.map(d=>kind==='net'?d.net:d.price),lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo*=.9;hi*=1.1}let y=v=>t+(hi-v)/(hi-lo)*(H-t-b), x=i=>l+i*(W-l-r)/Math.max(1,data.length-1);let points=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');let ix=Math.max(0,data.findIndex(d=>d.day===pickedDay));if(pickedDay==null||ix<0)ix=data.length-1;let picked=data[ix];return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="1일 단위 ${kind==='net'?'자산':'가격'} 차트"><line x1="${l}" x2="${W-r}" y1="${t}" y2="${t}" stroke="#e5ebf4"/><line x1="${l}" x2="${W-r}" y1="${(t+H-b)/2}" y2="${(t+H-b)/2}" stroke="#e5ebf4"/><line x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}" stroke="#e5ebf4"/><text x="0" y="${t+5}" font-size="11" fill="#718096">${Math.round(hi).toLocaleString()}</text><text x="0" y="${H-b}" font-size="11" fill="#718096">${Math.round(lo).toLocaleString()}</text><polyline class="chartline" points="${points}"/>${data.map((d,i)=>`<circle class="chartpoint" cx="${x(i)}" cy="${y(vals[i])}" r="${d.day===picked.day?5:3.2}" onclick="pickedDay=${d.day};render()"><title>${d.day}일차: ${money(vals[i])}</title></circle>`).join('')}<text x="${l}" y="${H-5}" fill="#718096" font-size="12">${data[0].day}일차</text><text x="${W-r}" y="${H-5}" fill="#718096" font-size="12" text-anchor="end">${data[data.length-1].day}일차</text></svg><div class="center sub">선택한 날짜: <b>${picked.day}일차</b> · ${money(kind==='net'?picked.net:picked.price)} ${kind==='price'?`(${signed(picked.change)})`:''} · 점을 눌러 날짜별로 확인</div>`}
function candlechart(data){
 if(!data.length)return '<div class="empty">아직 거래일 기록이 없어요.</div>';
 const W=680,H=260,l=55,r=15,t=21,b=36, lo0=Math.min(...data.map(d=>d.low??d.price)),hi0=Math.max(...data.map(d=>d.high??d.price));
 let gap=Math.max(1,(hi0-lo0)*.12),lo=Math.max(0,lo0-gap),hi=hi0+gap;
 const y=v=>t+(hi-v)/(hi-lo)*(H-t-b),step=(W-l-r)/data.length,x=i=>l+step*(i+.5),width=Math.min(22,Math.max(5,step*.52));
 let chosen=data.find(d=>d.day===pickedDay)||data[data.length-1];
 let candles=data.map((d,i)=>{let o=d.open??d.price,h=d.high??d.price,low=d.low??d.price,cl=d.close??d.price,color=cl>=o?'#db4764':'#2783d1',xx=x(i);
 return `<line x1="${xx}" y1="${y(h)}" x2="${xx}" y2="${y(low)}" stroke="${color}" stroke-width="2"/><rect x="${xx-width/2}" y="${Math.min(y(o),y(cl))}" width="${width}" height="${Math.max(2,Math.abs(y(o)-y(cl)))}" rx="1.5" fill="${color}"/><rect x="${xx-step/2}" y="${t}" width="${step}" height="${H-b-t}" fill="transparent" onclick="pickedDay=${d.day};render()" style="cursor:pointer"><title>${d.day}일차 시가 ${o} 고가 ${h} 저가 ${low} 종가 ${cl}</title></rect>${d.day===chosen.day?`<line x1="${xx}" x2="${xx}" y1="${t}" y2="${H-b}" stroke="#a5b4c8" stroke-dasharray="3 3"/>`:''}`}).join('');
 let lines=[hi0,(hi0+lo0)/2,lo0].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="#e6ebf2"/><text x="${l-5}" y="${y(v)+4}" text-anchor="end" fill="#728197" font-size="11">${Math.round(v).toLocaleString()}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="게임 1일 단위 시가 고가 저가 종가 봉차트">${lines}${candles}<text x="${l}" y="${H-9}" font-size="12" fill="#718096">${data[0].day}일차</text><text x="${W-r}" y="${H-9}" text-anchor="end" font-size="12" fill="#718096">${data[data.length-1].day}일차</text></svg><div class="candle-key"><span><i class="candle-dot" style="background:#db4764"></i>상승 봉</span><span><i class="candle-dot" style="background:#2783d1"></i>하락 봉</span><span>봉을 누르면 날짜별 가격이 표시돼요</span></div><div class="news small" style="margin-top:8px"><b>${chosen.day}일차</b> · 시가 ${money(chosen.open)} · 고가 ${money(chosen.high)} · 저가 ${money(chosen.low)} · 종가 ${money(chosen.close)}</div><p class="hint">※ 하루 한 번 가격을 확정하는 게임이므로 봉의 고가·저가는 교육용 모의 값입니다.${data.some(d=>d.reconstructed)?' 기존 거래일의 봉은 종가 기록을 바탕으로 재구성했습니다.':''}</p>`
}
function detailView(){let a=asset(selected);if(!a)return market();let subset=range==='all'?history:history.slice(-(range==='7'?7:14));return `<div class="flex wrap" style="margin-bottom:15px"><button class="btn ghost sm" onclick="go('market')">← 시장 목록</button><span class="tag">${esc(a.sector)} · ${risk[a.risk]}</span></div><div class="grid"><div class="card"><div class="flex"><div><h2>${esc(a.name)}</h2><div class="sub">${a.id} · ${a.type==='stock'?'기업 주식':a.type==='etf'?'상장지수펀드':a.type==='bond'?'채권':'금'}</div></div><div class="right"><div class="big">${money(a.price)}</div><b class="${a.change>=0?'up':'down'}">${signed(a.change)} 오늘</b></div></div><div class="flex wrap" style="margin:25px 0 12px"><b>1일 단위 가격 차트</b><div class="seg">${[['7','최근 7일'],['14','14일'],['all','전체']].map(([k,v])=>`<button class="${range===k?'active':''}" onclick="range='${k}';pickedDay=null;render()">${v}</button>`).join('')}</div></div>${svgchart(subset)}<div class="company-about"><b>🔎 ${a.type==='stock'?'이 회사는 무슨 일을 할까?':'어떤 상품일까?'}</b><div>${esc(a.description||'')}</div></div><div class="alert">가격은 하루에 한 번 갱신되며, 봉차트는 교육용으로 구성한 시가·고가·저가·종가를 보여줍니다.</div>${a.type==='etf'?`<p class="sub">ETF는 구성 주식의 등락을 바탕으로 계산됩니다. 2배 상품은 매일 수익률을 재설정하여 여러 날 누적 수익률의 정확히 2배가 아닐 수 있어요.</p>`:a.type==='bond'?`<p class="sub">연말까지 보유한 채권에는 상품별 모의 이자가 지급됩니다. 가격 손실은 별도로 발생할 수 있어요.</p>`:''}</div><div class="card"><h2>${S.role==='admin'?'교사용 거래 미리보기':'거래하기'}</h2><div class="sub">매수·매도는 현재 가격으로 즉시 체결됩니다. 하루 동안 가격은 동일합니다.</div><div class="seg jump"><button id="buyBtn" class="${currentSide==='buy'?'active':''}" onclick="orderSide('buy')">매수</button><button id="sellBtn" class="${currentSide==='sell'?'active':''}" onclick="orderSide('sell')">매도</button></div><label>수량</label><input class="input" id="qty" type="number" min="1" value="1" oninput="updateOrderTotal()"><div class="flex jump"><span class="muted small">예상 주문 금액</span><b id="orderTotal">${money(a.price)}</b></div><label>왜 이 상품을 선택했나요?</label><textarea class="input" id="reason" rows="3" placeholder="예: 기술 산업이 성장한다는 뉴스를 보고 매수해요."></textarea><p class="hint">교사와 함께 나중에 투자 결정을 돌아볼 수 있도록 기록합니다.</p><button class="btn" style="width:100%;margin-top:13px" ${S.role==='admin'||S.room.phase!=='trading'||S.player?.day_ready?'disabled':''} onclick="place()">바로 거래하기</button>${S.room.phase!=='trading'?'<div class="alert">현재 거래가 마감되었습니다.</div>':S.player?.day_ready?'<div class="alert">오늘의 선택이 완료되었습니다. 먼저 선택 완료를 취소하세요.</div>':''}<div class="line"></div><h3>투자할 때 생각해 보기</h3><p class="sub">이 상품이 오르는 이유는 무엇일까? 예상과 다르게 하락한다면 어떻게 할까?</p><button class="btn secondary" onclick="go('news')">관련 시장 뉴스 확인 →</button></div></div>`}
let currentSide='buy';function orderSide(side){currentSide=side;$('#buyBtn').classList.toggle('active',side==='buy');$('#sellBtn').classList.toggle('active',side==='sell')}
function updateOrderTotal(){let a=asset(selected);$('#orderTotal').textContent=money(a.price*(parseInt($('#qty').value)||0))}
async function place(){let qty=+$('#qty').value;let reason=$('#reason').value.trim();if(!reason||reason.length<2)return toast('투자 이유를 2자 이상 적어주세요.');if(asset(selected).risk==='high'&&!confirm('이 상품은 변동성이 높고 크게 손실이 날 수 있습니다. 주문할까요?'))return;try{let d=await api('/orders',{method:'POST',body:{asset:selected,side:currentSide,qty,reason}});toast(d.message);tab='orders';refresh()}catch(e){toast(e.message)}}
function bank(){let active=S.deposits.filter(d=>d.status==='active');return `<div class="cols3">${metric('입출금 계좌',money(S.player.cash),'현재 사용 가능한 현금')}${metric('가입 중인 예금',active.length+'건',money(active.reduce((x,d)=>x+d.principal,0))+' 예치')}${metric('예금 약정 연수익률','10%','가상 게임 24일 = 1년')}</div><div class="divider"></div><div class="grid"><div class="card"><h2>🏦 정기예금 가입</h2><p class="sub">예금은 주가처럼 가격이 오르내리지 않고, 정해진 기간을 채우면 약속한 이자를 받습니다.</p><label>예금 기간</label><select class="input" id="term" onchange="bankCalc()">${[6,12,18,24].map(x=>`<option value="${x}">${x}일 예금 · +${(10*x/24).toFixed(2)}%</option>`).join('')}</select><label>예금 원금</label><input class="input" type="number" id="principal" value="10000" min="1000" step="1000" oninput="bankCalc()"><div class="news"><div class="flex"><span>만기일</span><b id="maturity"></b></div><div class="flex jump"><span>만기 수령액</span><b id="receive"></b></div></div><button class="btn" onclick="openDeposit()" ${S.role==='admin'||S.room.phase!=='trading'||S.player?.day_ready?'disabled':''}>정기예금 가입하기</button><div class="alert">게임 24일을 1년으로 가정한 교육용 이자율입니다. 중도해지 시 이자는 줄어듭니다.</div></div><div class="card"><h2>내 예금 통장</h2>${S.deposits.length?S.deposits.map(d=>`<div class="rowitem"><div class="flex"><b>${d.term}일 정기예금</b><span class="tag">${d.status==='active'?'진행 중':d.status==='matured'?'만기 완료':'중도해지'}</span></div><div class="muted small" style="margin-top:6px">가입 ${d.start_day}일차 · 만기 ${d.start_day+d.term-1}일차</div><div class="flex jump"><b>${money(d.principal)}</b>${d.status==='active'&&S.role==='player'&&!S.player.day_ready?`<button class="btn red sm" onclick="closeDeposit(${d.id})">중도 해지</button>`:`<span class="green small">수령 ${money(d.paid)}</span>`}</div></div>`).join(''):'<div class="empty">가입한 예금이 없습니다.</div>'}</div></div>`}
function bankCalc(){let t=+$('#term')?.value||6,p=+$('#principal')?.value||0;$('#maturity').textContent=(S.room.day+t-1)+'일차';$('#receive').textContent=money(p*(1+.10*t/24));}
async function openDeposit(){let t=+$('#term').value,p=+$('#principal').value;if(S.room.day+t-1>24)return toast('만기가 게임 종료 이후입니다. 더 짧은 예금을 골라주세요.');if(!confirm(`${money(p)}을 ${t}일 동안 예금할까요?`))return;try{await api('/deposits',{method:'POST',body:{term:t,principal:p}});toast('예금에 가입했습니다.');refresh()}catch(e){toast(e.message)}}
async function closeDeposit(id){if(!confirm('예금을 중도해지하면 이자가 줄어듭니다. 해지할까요?'))return;try{let r=await api('/deposits/'+id+'/close',{method:'POST'});toast('해지 완료: '+money(r.paid));refresh()}catch(e){toast(e.message)}}
function portfolio(){let p=S.player;let items=S.holdings.map(h=>({...h,a:asset(h.asset),val:h.qty*asset(h.asset).price}));let dep=S.deposits.filter(d=>d.status==='active').reduce((n,d)=>n+d.principal,0);let cashPct=p.net?100*p.cash/p.net:0;let vals=S.values||[];
return `<div class="cols3">${metric('내 총자산',money(p.net),'투자+현금+예금')}${metric('시작 이후 손익',money(p.profit),signed(p.profit/S.room.start_cash*100))}${metric('보유 현금',money(p.cash),`총자산의 ${cashPct.toFixed(1)}%`)}</div><div class="divider"></div><div class="grid"><div class="card"><h2>📈 내 자산 변화</h2>${svgchart(vals,'net')}<div class="line"></div><h3>내 자산 구성</h3><div class="percentbar"><span style="width:${Math.min(100,cashPct)}%"></span></div><p class="sub">현금 ${money(p.cash)} · 투자 ${money(items.reduce((n,h)=>n+h.val,0))} · 예금 ${money(dep)}</p></div><div class="card"><h2>보유 투자상품</h2><p class="sub">내가 가진 주식·ETF·채권·금에서 바로 매수하거나 매도할 수 있어요.</p>${items.length?items.map(h=>`<div class="rowitem"><div class="flex"><b>${esc(h.a.name)}</b><b>${money(h.val)}</b></div><div class="flex sub" style="margin-top:8px"><span>${h.qty}주 · 매입원금 ${money(h.cost)}</span><span class="${h.val-h.cost>=0?'up':'down'}">${signed(h.cost?(h.val-h.cost)/h.cost*100:0)}</span></div><div class="hold-actions"><button class="btn secondary sm" onclick="detail('${h.asset}','buy')">+ 추가 매수</button><button class="btn sm" onclick="detail('${h.asset}','sell')">− 매도</button></div></div>`).join(''):'<div class="empty">아직 주식·채권·금이 없어요. 시장에서 첫 거래를 해보세요.</div>'}<div class="line"></div><h3>예금 평가원금</h3><b>${money(dep)}</b></div></div>`}

function news(){
 let sectors=['전체',...new Set(S.assets.filter(a=>a.type==='stock').map(a=>a.sector))];
 let items=S.news.filter(x=>(newsScope==='all'||(newsScope==='today'?x.day===S.room.day:x.day>=(Math.ceil(S.room.day/6)-1)*6+1))&&(newsSector==='전체'||x.sector===newsSector||x.sector==='전체'));
 return `<div class="card"><h2>📰 하루금융 뉴스룸</h2><p class="sub">가상 기업의 사건과 반응이 매일 이어져요. 회사 이름을 살피고, 이미 확정된 결과와 아직 예정인 계획을 구분해 보세요. 가격 영향이 있는 기사는 다음 거래일에 반영돼요.</p><div class="flex wrap" style="margin:15px 0"><span class="story-count">오늘 뉴스 ${S.news.filter(x=>x.day===S.room.day).length}건</span><span class="sub">하루 약 4건 · 업종별 소식과 기업 연결</span></div><div class="flex wrap" style="margin:12px 0"><div class="seg">${[['today','오늘'],['quarter','이번 분기'],['all','전체']].map(([k,v])=>`<button class="${newsScope===k?'active':''}" onclick="newsScope='${k}';render()">${v}</button>`).join('')}</div><select class="input" style="max-width:185px" onchange="newsSector=this.value;render()">${sectors.map(sec=>`<option value="${esc(sec)}" ${sec===newsSector?'selected':''}>${sec==='전체'?'모든 업종':sec}</option>`).join('')}</select></div>${newsCards(items)}</div>`}

function orders(){return `<div class="grid"><div class="card"><h2>📑 내 주문</h2>${S.orders.length?S.orders.map(o=>`<div class="rowitem"><div class="flex"><b>${esc(asset(o.asset)?.name||o.asset)} · ${o.side==='buy'?'매수':'매도'} ${o.qty}주</b><span class="tag">${{pending:'접수됨',filled:'체결',cancelled:'취소',rejected:'거절'}[o.status]||o.status}</span></div><div class="flex jump"><span class="sub">${money(o.price*o.qty)} · ${esc(o.reason)}</span>${o.status==='pending'&&S.role==='player'?`<button class="btn ghost sm" onclick="cancelOrder(${o.id})">취소</button>`:''}</div></div>`).join(''):'<div class="empty">아직 주문이 없습니다.</div>'}</div><div class="card"><h2>💳 은행·거래 기록</h2>${S.ledger.length?S.ledger.map(x=>`<div class="rowitem"><div class="flex"><span><b>${esc(x.note)}</b><div class="sub">${x.day}일차 · ${x.kind}</div></span><b class="${x.amount>=0?'green':'negative'}">${x.amount>=0?'+':''}${money(x.amount)}</b></div></div>`).join(''):'<div class="empty">금융 활동을 시작해 보세요.</div>'}</div></div>`}
function teacherReadySummary(){let ps=S.participants||[],done=ps.filter(p=>p.day_ready).length;return `<div class="ready-strip ${S.all_ready?'':'pending'}"><div><strong>${S.all_ready?'🎉 모든 학생이 오늘의 투자 선택을 완료했어요!':'📋 학생별 오늘 선택 완료 현황'}</strong><p>${done} / ${ps.length}명 완료 ${!ps.length?'· 학생이 아직 참가하지 않았어요.':S.all_ready?'· 교사가 장 마감을 진행하면 됩니다.':'· 미완료 학생은 아래에 표시됩니다.'}</p><div class="ready-list">${ps.map(p=>`<span class="ready-label ${p.day_ready?'done':''}">${p.day_ready?'✓':'○'} ${esc(p.name)}</span>`).join('')}</div></div><span class="badge">${done}/${ps.length}명</span></div>`}
function teacherHome(){let ps=S.participants||[];return `${teacherReadySummary()}<div class="cols3">${metric('참가한 학생',ps.length+'명','학생마다 독립적인 자산')}${metric('진행 상태',daytext(S.room.day),S.room.phase==='trading'?'즉시 거래 중':S.room.phase==='closed'?'다음 날 진행 가능':'결산 완료')}${metric('선택 완료',`${S.ready_count||0}/${ps.length}명`,'학생의 하루 선택 완료 버튼')}</div><div class="divider"></div><div class="grid"><div class="card"><h2>👩‍🏫 수업 진행</h2><p>게임방 참가 코드: <span class="badge" style="font-size:17px">${esc(S.room.code)}</span></p><div class="alert">학생은 아래 QR을 찍고 이름과 개인 PIN을 입력합니다. 서로 다른 와이파이에서도 접속할 수 있습니다. 교사 비밀번호는 공유하지 마세요.</div><div id="shareBox" class="news"><b>📱 학생 참가 QR</b><p class="sub">공개 주소를 확인하고 있어요…</p></div><p class="sub">${S.room.phase==='trading'?'학생들이 선택 완료를 누르면 위에 표시됩니다. 교사가 원할 때 장 마감을 누르세요.':'현재 마감 상태입니다. 다음 날 버튼을 눌러 가격을 갱신하세요.'}</p><div class="flex wrap">${S.room.phase==='trading'?`<button class="btn" onclick="adminAction('close')">오늘 장 마감하기</button>`:S.room.phase==='closed'?`<button class="btn" onclick="adminAction('next')">다음 날 시작 →</button>`:'<span class="badge">24일 게임 종료</span>'}<button class="btn secondary" onclick="go('admin')">관리자 설정</button></div><div class="line"></div><h3>오늘 시장 뉴스</h3>${newsCards(S.news.filter(n=>n.day===S.room.day))}</div><div class="card"><h2>학생별 선택 현황 · 자산</h2>${ps.length?ps.map(p=>`<div class="rowitem flex"><div><b>${esc(p.name)}</b><div class="sub">${p.day_ready?'✅ 오늘 선택 완료':'⏳ 아직 선택 중'}</div></div><div class="right"><b>${money(p.net)}</b></div></div>`).join(''):'<div class="empty">아직 학생이 참가하지 않았습니다.</div>'}</div></div>`}

async function loadPreview(pid){
 try{previewPid=+pid;previewData=await api('/admin/student/'+previewPid);previewTab='home';render()}catch(e){toast(e.message)}
}
function adminPreview(){
 let names=S.participants||[];
 let chooser=`<div class="card" style="margin-bottom:14px"><div class="flex wrap"><div><h2>👀 학생 화면 보기</h2><p class="sub">실제 학생의 잔액과 보유 현황을 읽기 전용으로 확인합니다. 교사 계정으로는 거래할 수 없습니다.</p></div><select class="input" style="max-width:250px" onchange="loadPreview(this.value)"><option value="">학생 선택</option>${names.map(p=>`<option value="${p.id}" ${+previewPid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div>`;
 if(!names.length)return chooser+'<div class="empty">학생이 참가하면 여기에서 학생 화면을 볼 수 있어요.</div>';
 if(!previewData)return chooser+'<div class="alert">학생을 선택하면 학생의 홈·은행·보유자산·차트를 그대로 살펴볼 수 있어요.</div>';
 const pv=previewData, saved=S;
 S={...S,...pv,role:'admin'};
 let menu=`<div class="nav" style="position:static;margin-bottom:10px">${[['home','학생 홈'],['market','시장'],['bank','은행'],['portfolio','내 자산'],['news','뉴스'],['orders','거래 내역']].map(([k,v])=>`<button class="${previewTab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}</div>`;
 let views={home:playerHome,market,bank,portfolio,news,orders,detail:detailView};
 let body='';try{body=(views[previewTab]||playerHome)()}finally{S=saved}
 return chooser+`<div class="preview-banner">📱 ${esc(pv.player.name)} 학생의 실제 화면 · 읽기 전용 미리보기</div>`+menu+body;
}
function participants(){return `<div class="card"><h2>학생 계정과 자산</h2><div class="tablewrap"><table><thead><tr><th>학생</th><th>오늘 선택</th><th>총자산</th><th>현금</th><th>즉시 체결</th><th>현금 지급·차감</th></tr></thead><tbody>${S.participants.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${p.day_ready?'✅ 완료':'⏳ 선택 중'}</td><td>${money(p.net)}</td><td>${money(p.cash)}</td><td>${p.pending}건</td><td><button class="btn secondary sm" onclick="changeCash(${p.id},'${esc(p.name)}')">조정</button></td></tr>`).join('')}</tbody></table></div></div>`}
function adminOrders(){return `<div class="card"><h2>전체 학생 주문 · 최근 60건</h2><div class="tablewrap"><table><thead><tr><th>학생</th><th>상품</th><th>거래</th><th>수량</th><th>상태</th><th>선택 이유</th></tr></thead><tbody>${S.all_orders.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(asset(o.asset)?.name||o.asset)}</td><td>${o.side==='buy'?'매수':'매도'}</td><td>${o.qty}</td><td>${esc(o.status)}</td><td>${esc(o.reason)}</td></tr>`).join('')}</tbody></table></div></div>`}
function adminPanel(){return teacherReadySummary()+`<div class="grid"><div class="card"><h2>⏯ 거래일 진행</h2><p class="sub">현재: ${daytext(S.room.day)} · ${S.room.phase}</p><div class="flex wrap">${S.room.phase==='trading'?`<button class="btn" onclick="adminAction('close')">장 마감 · 주문 체결</button>`:S.room.phase==='closed'?`<button class="btn" onclick="adminAction('next')">다음 날 시작 · 가격 갱신</button>`:'<b>게임 종료</b>'}</div><div class="line"></div><h2>🌤 시장 분위기 조절</h2><p class="sub">정해진 뉴스 스토리 대신, 선택한 분위기에 맞춰 각 기업의 뉴스가 자동 생성됩니다. 긍정이어도 악재가 나올 수 있어요.</p><div class="seg">${[['positive','☀️ 긍정'],['neutral','⛅ 중립'],['negative','🌧 부정']].map(([k,v])=>`<button class="${(S.room.mood||'neutral')===k?'active':''}" onclick="setMarketMood('${k}')">${v}</button>`).join('')}</div><p class="hint">선택한 분위기는 <b>다음 거래일의 뉴스</b>부터 적용됩니다. 학생이 오늘 읽은 뉴스의 영향은 다음 날 주가에 반영됩니다. 과거 뉴스와 가격은 바뀌지 않습니다.</p><div class="line"></div><h2>시장 뉴스 추가</h2><p class="sub">추가한 뉴스의 주가 영향은 다음 날 갱신에 적용됩니다. 당일 가격은 바뀌지 않습니다.</p><label>뉴스 제목</label><input class="input" id="nt" placeholder="예: 기술기업 대규모 수주"><label>내용</label><textarea class="input" id="nb" rows="3" placeholder="학생이 이해할 수 있도록 내용을 적어 주세요."></textarea><div class="half"><div><label>영향 대상</label><select class="input" id="ns"><option value="전체">시장 전체</option>${[...new Set(S.assets.filter(a=>a.type==='stock').map(a=>a.sector))].map(x=>`<option value="${x}">${x}</option>`).join('')}${S.assets.filter(a=>a.type==='stock').map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div><label>다음날 가격 효과 (%p)</label><input class="input" id="ni" type="number" value="3" min="-12" max="12" step="0.5"></div></div><button class="btn secondary jump" onclick="addNews()">뉴스 발행</button></div><div class="card"><h2>📚 운영 기록</h2>${S.logs.map(l=>`<div class="rowitem"><div class="flex"><b>${esc(l.event)}</b><span class="tag">${l.day}일차</span></div><div class="sub" style="margin-top:7px">${esc(l.detail)}</div></div>`).join('')}</div></div>`}
async function adminAction(op){let msg=op==='close'?'학생들의 선택을 모두 확인했나요? 교사가 오늘 장을 마감합니다. 이미 체결된 거래는 유지됩니다.':'다음 거래일을 시작하고 가격을 갱신할까요?';if(!confirm(msg))return;try{let r=await api('/admin/'+op,{method:'POST'});toast(op==='close'?`체결 ${r.filled}건 · 거절 ${r.rejected}건`:`${r.day}일차 시작!`);refresh()}catch(e){toast(e.message)}}
async function setMarketMood(mood){try{await api('/admin/mood',{method:'POST',body:{mood}});toast('다음 거래일 뉴스 분위기를 설정했어요.');refresh()}catch(e){toast(e.message)}}
async function addNews(){try{await api('/admin/news',{method:'POST',body:{title:$('#nt').value,body:$('#nb').value,sector:$('#ns').value,impact:+$('#ni').value}});toast('뉴스를 발행했습니다.');refresh()}catch(e){toast(e.message)}}
async function changeCash(id,name){let a=prompt(name+' 학생의 현금 변동액을 입력하세요. (차감은 음수)', '10000');if(a===null)return;let b=prompt('변경 사유를 적으세요.','학습 활동 보상');if(!b)return;try{await api('/admin/cash',{method:'POST',body:{player_id:id,amount:parseInt(a),reason:b}});toast('현금을 변경했습니다.');refresh()}catch(e){toast(e.message)}}
async function cancelOrder(id){try{await api('/orders/'+id+'/cancel',{method:'POST'});toast('주문 취소 완료');refresh()}catch(e){toast(e.message)}}
async function loadShare(){
 const el=$('#shareBox');if(!el)return;
 try{
   const v=await api('/share');
   if(!el.isConnected)return;
   if(v.qr){el.innerHTML=`<b>📱 학생 참가 QR</b><p class="sub">QR을 태블릿으로 스캔하면 방 코드가 자동 입력됩니다. 학생은 이름과 개인 PIN만 입력하면 됩니다.</p><div style="text-align:center"><img alt="학생 참가 QR 코드" src="${v.qr}" style="width:min(240px,85%);image-rendering:pixelated;border-radius:12px;background:white;padding:8px" /></div><div style="word-break:break-all" class="small">${esc(v.url)}</div><button class="btn secondary sm jump" onclick="copyJoin()">학생 접속 주소 복사</button>`; window._shareUrl=v.url;}
   else el.innerHTML=`<b>📱 학생 참가 QR 준비 중</b><p class="sub">${esc(v.message||'외부 연결을 기다리는 중입니다.')} ${v.status==='starting'?'잠시 뒤 자동 갱신됩니다.':''}</p>`;
 }catch(e){el.innerHTML='<b>QR 연결 확인 실패</b><p class="sub">'+esc(e.message)+'</p>'}
}
function copyJoin(){navigator.clipboard.writeText(window._shareUrl||'').then(()=>toast('주소를 복사했습니다.')).catch(()=>prompt('주소를 복사하세요',window._shareUrl||''))}
function render(){if(!S){$('#app').innerHTML=authView();return}$('#app').innerHTML=head();let view=S.role==='admin'?({home:teacherHome,preview:adminPreview,players:participants,news,orders:adminOrders,admin:adminPanel}[tab]||teacherHome):({home:playerHome,market,detail:detailView,bank,portfolio,news,orders}[tab]||playerHome);$('#page').innerHTML=view();if(tab==='bank'||(S.role==='admin'&&tab==='preview'&&previewTab==='bank'&&previewData))bankCalc();if(S.role==='admin'&&tab==='home')loadShare()}
render();if(token)refresh();setInterval(()=>{if(S?.role==='admin'&&tab==='home'&&!window._shareUrl)loadShare()},3500);setInterval(()=>{if(token&&S&&['home','market','portfolio','news','orders','players'].includes(tab)&&document.visibilityState==='visible')refresh()},12000);
</script></body></html>
